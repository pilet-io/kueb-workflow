name: org-kueb-create
description: Create kueb entity
args:
  org: required
  name: required
run:
- sql/list:
    select: host from system.host
- random:
    from: $.sql_list
- log:
    message: Host is $.random.host
- ssh:
    host: $.random.host
    command: with lxc create kueb --org $.args.org --name $.args.name
- log:
    message: Got ip4 $.ssh.ip4
- sql/update:
      set:
        profile: medium
        host: $.random.host
        dns: $.ssh.dns
        ip4: $.ssh.ip4
        ip6: $.ssh.ip6
        status: DONE
      in: org.kueb
      where: org = '$.args.org' and name = '$.args.name'
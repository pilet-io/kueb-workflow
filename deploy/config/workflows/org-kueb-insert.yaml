name: org-kueb-insert
description: Create kueb entity
args:
  org: required
  name: required
  profile: required

run:
  - sql/get:
      select: org,zone from iam.org where org = '$.args.org'
    as: org
  - sql/update:
      set:
        status: RUNNING
      in: org.kueb
      where: org = '$.args.org' and name = '$.args.name'
  - sql/list:
      select: host from org.host
  - random:
      from: $.sql_list
      #start: 2
      fixed: 2
  - log:
      message: Host is $.random.host
  - ssh:
      host: $.random.host
      command: with lxc create kueb --org $.args.org --name $.args.name
  - sql/save:
      insert:
        org: $.args.org
        name: $.args.name
        key: kubeconfig
        value: $.ssh._file
      into: org.kueb_attributes
  - sql/update:
      set:
        product: kueb-$.args.profile
        profile: $.args.profile
        host: $.random.host
        dns: $.ssh.dns
        ip4: $.ssh.ip4
        ip6: $.ssh.ip6
        status: DONE
      in: org.kueb
      where: org = '$.args.org' and name = '$.args.name'

  - sql/save:
      insert:
        org: $.args.org
        name: $.args.name
        dns: $.ssh.name
        zone: $.org.zone
        cname: $.random.host
      into: routing.entry
  - sql/save:
      insert:
        org: $.args.org
        name: $.args.name
        host: $.random.host
        entry: https
        ip4: $.ssh.ip4
        port: 80
        tls: zone
        dns: $.ssh.name
        zone: $.org.zone
      into: routing.route
  - sql/save:
      insert:
        org: $.args.org
        name: $.args.name
        host: $.random.host
        entry: k8s
        ip4: $.ssh.ip4
        port: 6443
        tls: pass
        dns: $.ssh.name
        zone: $.org.zone
      into: routing.route

  - sql/list:
      select: app from org.app where org = '$.args.org' and name = '$.args.name' and status = 'REQUESTED'
  - for:
      each: app
      in: $.sql_list
      run:
        - sql/update:
            set:
              status: RUNNING
            in: org.app
            where: org = '$.args.org' and name = '$.args.name' and app = '$.app.app'
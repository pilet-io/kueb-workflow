name: routing-route-insert
description: Insert routing route info
args:
  org: required
  name: required
  host: required
  entry: required
  ip4: required
  port: required
  tls: required
  dns: required
  zone: required

run:
  - ssh:
      host: $.args.host
      command: with lxc create route-$.args.tls --org $.args.org --name $.args.name --entry $.args.entry --zone $.args.zone --ip4 $.args.ip4 --port $.args.port
  - log:
      message: Ssh lxc create route-$.args.entry returned $.ssh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kueb-workflow
  labels:
    app: kueb-workflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kueb-workflow
  template:
    metadata:
      labels:
        app: kueb-workflow
    spec:
      imagePullSecrets:
        - name: dockersec
      containers:
        - name: kueb-workflow
          image: pilet/kueb-workflow:${POM_VERSION}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kueb-workflow
spec:
  type: NodePort
  ports:
    - nodePort: 30080
      port: 8080
      targetPort: 8080
  selector:
    app: kueb-workflow